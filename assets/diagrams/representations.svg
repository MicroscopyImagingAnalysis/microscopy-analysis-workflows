<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Complementary nuclear representations</title>
  <desc id="desc">A segmented nucleus branches into measured features, a spatial graph and a learned latent vector.</desc>
  <defs><style>.h{font:700 26px Arial,sans-serif;fill:#0b132b}.t{font:700 18px Arial,sans-serif;fill:#0b132b}.s{font:14px Arial,sans-serif;fill:#344966}.edge{stroke:#506784;stroke-width:3;fill:none}</style></defs>
  <rect width="1200" height="470" rx="22" fill="#f7fafc"/>
  <text x="48" y="55" class="h">One nucleus, three complementary descriptions</text>
  <g transform="translate(80 120)"><ellipse cx="125" cy="125" rx="110" ry="100" fill="#dcecff" stroke="#247ba0" stroke-width="4"/><ellipse cx="105" cy="105" rx="28" ry="24" fill="#ef476f" opacity=".75"/><ellipse cx="165" cy="135" rx="23" ry="31" fill="#7b61a8" opacity=".75"/><circle cx="92" cy="158" r="17" fill="#2a9d8f"/><text x="125" y="250" text-anchor="middle" class="t">Segmented nucleus</text></g>
  <path d="M315 210 C390 130 430 120 500 120" class="edge"/><path d="M315 240 C390 240 430 240 500 240" class="edge"/><path d="M315 270 C390 350 430 360 500 360" class="edge"/>
  <g transform="translate(500 78)"><rect width="620" height="92" rx="16" fill="#fff1cc" stroke="#f4a261" stroke-width="2"/><text x="24" y="34" class="t">Feature vector</text><text x="24" y="64" class="s">area · hull · curvature · intensity · texture · radial organization</text><g transform="translate(450 20)" fill="#f4a261"><rect width="18" height="50"/><rect x="30" y="20" width="18" height="30"/><rect x="60" y="8" width="18" height="42"/><rect x="90" y="28" width="18" height="22"/></g></g>
  <g transform="translate(500 194)"><rect width="620" height="92" rx="16" fill="#d9f7ef" stroke="#2a9d8f" stroke-width="2"/><text x="24" y="34" class="t">Spatial graph</text><text x="24" y="64" class="s">dense-region and boundary nodes · distances · topology · temporal matches</text><g transform="translate(490 15)" stroke="#2a9d8f" stroke-width="3"><line x1="10" y1="25" x2="70" y2="8"/><line x1="10" y1="25" x2="42" y2="62"/><line x1="70" y1="8" x2="102" y2="52"/><line x1="42" y1="62" x2="102" y2="52"/><g fill="#2a9d8f"><circle cx="10" cy="25" r="8"/><circle cx="70" cy="8" r="8"/><circle cx="42" cy="62" r="8"/><circle cx="102" cy="52" r="8"/></g></g></g>
  <g transform="translate(500 310)"><rect width="620" height="92" rx="16" fill="#fce1e8" stroke="#ef476f" stroke-width="2"/><text x="24" y="34" class="t">Learned latent vector</text><text x="24" y="64" class="s">VAE reconstruction · compact embedding · condition-aware CVAE signal</text><g transform="translate(470 31)" fill="#ef476f"><circle cx="10" cy="10" r="10"/><circle cx="45" cy="10" r="7" opacity=".8"/><circle cx="77" cy="10" r="13" opacity=".65"/><circle cx="115" cy="10" r="6" opacity=".5"/></g></g>
  <text x="1120" y="440" text-anchor="end" class="s">Representations can be analyzed separately or joined by object identity.</text>
</svg>
